name: Docker

on:
  push:
    branches: [ krusta4711_fix_HA_discovery_for_other_languages ]


jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Get version
      id: version
      run: |
        dotnet tool install --global minver-cli --version 6.0.0
        echo "version=$(minver --tag-prefix v)" >> $GITHUB_OUTPUT
    - name: Log version passed to Docker
      run: echo "Passing VERSION=${{ steps.version.outputs.version }} to Docker build"
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build
      uses: docker/build-push-action@v6
      with:
        platforms: linux/amd64
        push: true
        tags: krusta/ism7mqtt_fork:add_logging_of_used_version
        build-args: VERSION=${{ steps.version.outputs.version }}
